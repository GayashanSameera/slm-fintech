# ==============================================================================
# Stack 2 of 4: SECURITY  (deploy after `data`)
#
#   tenant-data role    the ONLY role that can read or write tenant data.
#                       Lambdas assume it per tenant with a session tag
#                       tenant_id=<t>; its policy only reaches that tenant's
#                       DynamoDB keys and S3 prefix (security.md §4.2, layer 2).
#   API-key pepper      Secrets Manager secret, value generated by AWS
#   GuardDuty role      lets GuardDuty Malware Protection scan and tag uploads
#   Retention lock      sets Bedrock data retention to `none` in the 3 inference Regions
#
# The 7 Lambda execution roles are NOT here: they live in app.yaml next to the
# functions, because each one needs the ARNs of the queues it uses. They are
# all named "slm-<env>-fn-<name>", and the tenant-data trust policy below
# accepts exactly that name pattern.
# ==============================================================================
AWSTemplateFormatVersion: "2010-09-09"
Description: SLM Fintech - security stack (tenant-data role, secrets, GuardDuty role)

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  EnforceTenantEncryptionContext:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: MUST be the same value as in the data stack (see data.yaml for what it does).
  CreateTrail:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      "true" creates a CloudTrail trail for this account (security.md §9). Set "false" if the
      AWS Organization already has an organisation trail covering this account.

Conditions:
  EnforceContext: !Equals [!Ref EnforceTenantEncryptionContext, "true"]
  TrailOn: !Equals [!Ref CreateTrail, "true"]

Resources:
  # ----------------------------------------------------------------------------
  # tenant-data role (attribute-based access control).
  #
  # How it works, step by step:
  #   1. app/storage/aws.py tenant_session(t) calls sts:AssumeRole on this role
  #      with Tags=[{"Key": "tenant_id", "Value": t}].
  #   2. Inside the resulting session, ${aws:PrincipalTag/tenant_id} == t.
  #   3. Every statement below is pinned to that tag, so the session can only
  #      touch "TENANT#t" items and "tenants/t/" objects.
  # A bug that passes tenant B's id while holding tenant A's session gets
  # AccessDenied from AWS itself.
  #
  # NOTE on "${aws:PrincipalTag/tenant_id}": IAM fills this in at request time.
  # In a PLAIN string CloudFormation leaves it alone. Inside !Sub it must be
  # written "${!aws:PrincipalTag/tenant_id}" (the "!" stops CloudFormation from
  # trying to substitute it), as in the S3 object ARN below.
  # ----------------------------------------------------------------------------
  TenantDataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub slm-${Env}-tenant-data
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Only our own Lambda roles (by name pattern) may assume this role.
          - Sid: OnlyPlatformFunctions
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/slm-${Env}-fn-*"
          # ...and they MUST tag the session with a tenant id, and nothing else.
          - Sid: SessionMustCarryTenantTag
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: sts:TagSession
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/slm-${Env}-fn-*"
              StringLike:
                aws:RequestTag/tenant_id: "t_*"          # app/core/ids.py new_tenant_id()
              ForAllValues:StringEquals:
                aws:TagKeys: [tenant_id]
      Policies:
        - PolicyName: one-tenant-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DynamoDB: only items whose partition key is this tenant's.
              # (Writes to APIKEY# items are impossible from here: that's deliberate.)
              - Sid: OwnTenantItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem          # job deletion removes corrections in a batch
                Resource: { "Fn::ImportValue": !Sub "slm-${Env}-TableArn" }
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: ["TENANT#${aws:PrincipalTag/tenant_id}"]
              # S3: only objects under this tenant's prefix.
              - Sid: OwnTenantObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObjectTagging          # read GuardDuty's scan-result tag
                  - s3:PutObjectTagging
                Resource: !Sub
                  - "${BucketArn}/tenants/${!aws:PrincipalTag/tenant_id}/*"
                  - BucketArn: { "Fn::ImportValue": !Sub "slm-${Env}-BucketArn" }
              # Listing is needed to delete a whole job prefix (Blobs.delete_prefix);
              # it is limited to this tenant's prefix too.
              - Sid: ListOwnTenantPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: { "Fn::ImportValue": !Sub "slm-${Env}-BucketArn" }
                Condition:
                  StringLike:
                    s3:prefix: ["tenants/${aws:PrincipalTag/tenant_id}/*"]
              # KMS for the documents key, only through S3. With the enforcement
              # switch on, also only for objects encrypted with THIS tenant's context.
              - Sid: DocumentsKeyThroughS3
                Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: { "Fn::ImportValue": !Sub "slm-${Env}-DocumentsKeyArn" }
                Condition: !If
                  - EnforceContext
                  - StringEquals:
                      kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
                      kms:EncryptionContext:tenant_id: "${aws:PrincipalTag/tenant_id}"
                  - StringEquals:
                      kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com

  # ----------------------------------------------------------------------------
  # API-key pepper (security.md §6.1). Secrets Manager GENERATES the value, so
  # it never appears in a template, a parameter file or a terminal.
  # Read by the authorizer Lambda through app/core/secrets.py api_key_pepper().
  #
  # Per-tenant webhook secrets are created by scripts/create_tenant.py under
  # the name prefix slm/<env>/webhook/ (the webhook Lambda may read only those).
  # ----------------------------------------------------------------------------
  ApiKeyPepper:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain          # losing the pepper invalidates EVERY API key
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub slm/${Env}/api-key-pepper
      Description: HMAC pepper for API-key hashes. Changing it invalidates all API keys.
      KmsKeyId: { "Fn::ImportValue": !Sub "slm-${Env}-LogsKeyArn" }
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ----------------------------------------------------------------------------
  # Role for GuardDuty Malware Protection for S3 (the plan itself is in app.yaml).
  # GuardDuty uses it to: create its own EventBridge rule on the bucket, read new
  # objects, and write the scan result as an object tag.
  # Permissions follow the AWS documentation for this feature; re-check them
  # against the current docs when first deploying (phase 0).
  # ----------------------------------------------------------------------------
  MalwareScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub slm-${Env}-guardduty-malware-scan
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: malware-protection-plan.guardduty.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: scan-documents-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManagedEventBridgeRule
                Effect: Allow
                Action: [events:PutRule, events:DeleteRule, events:PutTargets, events:RemoveTargets]
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
                Condition:
                  StringLike: { events:ManagedBy: malware-protection-plan.guardduty.amazonaws.com }
              - Sid: DescribeManagedRule
                Effect: Allow
                Action: [events:DescribeRule, events:ListTargetsByRule]
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
              - Sid: BucketConfiguration
                Effect: Allow
                Action: [s3:PutBucketNotification, s3:GetBucketNotification, s3:ListBucket]
                Resource: { "Fn::ImportValue": !Sub "slm-${Env}-BucketArn" }
              - Sid: ValidationObject
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub
                  - "${BucketArn}/malware-protection-resource-validation-object"
                  - BucketArn: { "Fn::ImportValue": !Sub "slm-${Env}-BucketArn" }
              - Sid: ReadAndTagObjects
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:GetObjectTagging, s3:PutObjectTagging,
                         s3:GetObjectVersionTagging, s3:PutObjectVersionTagging]
                Resource: !Sub
                  - "${BucketArn}/*"
                  - BucketArn: { "Fn::ImportValue": !Sub "slm-${Env}-BucketArn" }
              - Sid: DecryptDocuments
                Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: { "Fn::ImportValue": !Sub "slm-${Env}-DocumentsKeyArn" }
                Condition:
                  StringLike: { kms:ViaService: "s3.*.amazonaws.com" }

  # ----------------------------------------------------------------------------
  # CloudTrail: a record of every AWS API call in the account (who, what, when),
  # for audits and incident response (NFR-S4). Management events only: the FIRST
  # copy of management events is free; we pay just for S3 storage and KMS.
  # Data events (every S3 object read) are NOT recorded: they would cost per
  # request and repeat what the app's audit records already say.
  # Also feeds the security alerts in observability.yaml (EventBridge rule).
  # ----------------------------------------------------------------------------
  TrailBucket:
    Type: AWS::S3::Bucket
    Condition: TrailOn
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "Access logging for the audit-log bucket would only log CloudTrail's own writes."
          - id: CKV_AWS_21
            comment: "CloudTrail log-file validation (digest files) already proves logs were not changed."
    Properties:
      BucketName: !Sub slm-${Env}-trail-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }   # files are ALSO KMS-encrypted by CloudTrail
      LifecycleConfiguration:
        Rules:
          - Id: keep-one-year
            Status: Enabled
            ExpirationInDays: 400                # > 180-day audit retention (NFR-C4) with margin

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: TrailOn
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailChecksBucket
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals: { aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/slm-${Env}-trail" }
          - Sid: CloudTrailWritesLogs
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/slm-${Env}-trail"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt TrailBucket.Arn, !Sub "${TrailBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  Trail:
    Type: AWS::CloudTrail::Trail
    Condition: TrailOn
    DependsOn: TrailBucketPolicy             # CloudTrail checks the bucket policy on creation
    Properties:
      TrailName: !Sub slm-${Env}-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true               # also catches activity in regions we don't use
      IncludeGlobalServiceEvents: true       # IAM, STS, ...
      EnableLogFileValidation: true          # digest files prove nobody edited the logs
      KMSKeyId: { "Fn::ImportValue": !Sub "slm-${Env}-LogsKeyArn" }

  # ----------------------------------------------------------------------------
  # Bedrock ZERO DATA RETENTION, locked by the infrastructure (NFR-S10, security.md §5.2).
  #
  # The account data-retention mode is a per-Region account setting with no CloudFormation
  # resource of its own, so this stack sets it with a small custom resource: on every
  # create/update the Lambda below PUTs mode "none" in each inference Region (us-east-1,
  # us-east-2, us-west-2 are where the `us.` profiles may run) and reads it back. If any Region
  # does not report "none", the Lambda fails and so does the stack deployment: nobody can ship
  # an environment that quietly retains data. A model that needs retention (such as Claude
  # Fable) is then blocked by Bedrock with a ValidationException, instead of being used.
  #
  # Deleting the stack does NOT loosen the setting: the Delete event does nothing, on purpose.
  # The role below can only ever set "none" (condition bedrock:DataRetentionMode).
  # ----------------------------------------------------------------------------
  RetentionLockLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/slm-${Env}-retention-lock"
      RetentionInDays: 30
      KmsKeyId: { "Fn::ImportValue": !Sub "slm-${Env}-LogsKeyArn" }

  RetentionLockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub slm-${Env}-retention-lock
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: retention-lock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${RetentionLockLogs.Arn}:*"
              - Sid: SetModeNoneOnly
                Effect: Allow
                Action: bedrock:PutAccountDataRetention
                Resource: "*"
                Condition:
                  StringEquals: { "bedrock:DataRetentionMode": "none" }
              - Sid: ReadMode
                Effect: Allow
                Action: bedrock:GetAccountDataRetention
                Resource: "*"
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_290
            comment: "These Bedrock account-settings actions do not support resource-level permissions; they are restricted by the DataRetentionMode condition instead."
          - id: CKV_AWS_355
            comment: "Same reason: the account data-retention API has no resource ARN."

  RetentionLockFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub slm-${Env}-retention-lock
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 120
      MemorySize: 128
      Role: !GetAtt RetentionLockRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request, urllib.error
          import boto3
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest

          def call(method, region, mode=None):
              """Signed call to the Bedrock control plane: GET or PUT /data-retention."""
              url = f"https://bedrock.{region}.amazonaws.com/data-retention"
              body = json.dumps({"mode": mode}) if mode else ""
              req = AWSRequest(method=method, url=url, data=body, headers={"Content-Type": "application/json"})
              SigV4Auth(boto3.Session().get_credentials(), "bedrock", region).add_auth(req)
              r = urllib.request.Request(url, data=body.encode() or None, method=method, headers=dict(req.headers))
              try:
                  return json.loads(urllib.request.urlopen(r, timeout=20).read())
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"{method} {region}: HTTP {e.code}") from None

          def reply(event, context, status, reason=""):
              """Tell CloudFormation the result: a PUT of a small JSON document to the pre-signed
              ResponseURL. (Written out here because the 'cfnresponse' helper module is NOT
              available to inline Python code on this runtime: deploying with it hung for an hour.)"""
              body = json.dumps({"Status": status, "Reason": reason or f"See log stream {context.log_stream_name}",
                                 "PhysicalResourceId": "bedrock-retention-none", "StackId": event["StackId"],
                                 "RequestId": event["RequestId"], "LogicalResourceId": event["LogicalResourceId"],
                                 "Data": {}}).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"Content-Type": "", "Content-Length": str(len(body))})
              urllib.request.urlopen(req, timeout=20).read()

          def handler(event, context):
              """Create/Update: set mode none in every Region and verify. Delete: do nothing."""
              try:
                  if event["RequestType"] != "Delete":
                      for region in event["ResourceProperties"]["Regions"]:
                          call("PUT", region, "none")
                          got = call("GET", region)["mode"]
                          if got != "none":
                              raise RuntimeError(f"{region} reports mode {got}, expected none")
                          print(json.dumps({"event": "retention_locked", "region": region, "mode": got}))
                  reply(event, context, "SUCCESS")
              except Exception as exc:    # fail the stack loudly: never ship an environment that retains data
                  print(json.dumps({"event": "retention_lock_failed", "exc_type": type(exc).__name__, "detail": str(exc)}))
                  reply(event, context, "FAILED", f"{type(exc).__name__}: {exc}"[:200])
      LoggingConfig: { LogGroup: !Ref RetentionLockLogs }

  BedrockRetentionNone:
    Type: Custom::BedrockDataRetention
    Properties:
      ServiceToken: !GetAtt RetentionLockFunction.Arn
      # Give up after 5 minutes instead of CloudFormation's default of one hour if the function
      # never answers (it should answer within seconds).
      ServiceTimeout: 300
      Mode: none
      Regions: [us-east-1, us-east-2, us-west-2]

Outputs:
  TenantDataRoleArn:
    Value: !GetAtt TenantDataRole.Arn
    Export: { Name: !Sub "slm-${Env}-TenantDataRoleArn" }
  ApiKeyPepperArn:
    Value: !Ref ApiKeyPepper
    Export: { Name: !Sub "slm-${Env}-ApiKeyPepperArn" }
  MalwareScanRoleArn:
    Value: !GetAtt MalwareScanRole.Arn
    Export: { Name: !Sub "slm-${Env}-MalwareScanRoleArn" }
