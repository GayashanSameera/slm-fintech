# Local proof of concept (docs/local-setup.md).
#
# Recommended: run only the model in Docker, and the API directly with uv:
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull qwen3-vl:4b      # once, 3.3 GB
#   uv run uvicorn app.asgi:app --port 8000                 # then open http://localhost:8000
#
# Or run both in Docker:
#   docker compose --profile api up -d
#
# Services:
#   ollama   runs the AI model on your CPU; reachable only from this machine (127.0.0.1)
#   api      the FastAPI app (optional profile "api"); stores everything in ./data
# No queue and no login: uploads are processed one at a time inside the request.

services:
  ollama:
    image: ollama/ollama:0.12.7
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Memory on a 16 GB laptop is the limit. Measured for qwen3-vl:4b: with a 16k context
      # Ollama wanted 9.8 GB and refused to load. These settings bring it down:
      OLLAMA_CONTEXT_LENGTH: "8192"   # tokens the model can read at once (text + page images)
      OLLAMA_FLASH_ATTENTION: "1"     # a leaner way to compute attention: much less working memory
      OLLAMA_KV_CACHE_TYPE: "q8_0"    # store the context cache in 8 bits instead of 16 (half the size)
      OLLAMA_NUM_PARALLEL: "1"        # one request at a time keeps memory predictable on CPU
      OLLAMA_KEEP_ALIVE: "30m"        # keep the model loaded between documents
    volumes:
      - ollama:/root/.ollama          # downloaded models survive restarts
    restart: unless-stopped

  api:
    build: .
    profiles: ["api"]
    env_file: .env
    environment:
      SLM_MODEL_BASE_URL: http://ollama:11434/v1   # inside Docker, Ollama is reached by its service name
      SLM_DATA_DIR: /srv/data
    # Run as your own user so files written to ./data belong to you, not root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/srv/data              # documents and results: visible on your machine
      - ./tools:/srv/tools:ro         # the test UI served at /ui
    depends_on:
      - ollama

volumes:
  ollama:
    # Same volume as the "docker run ... -v slm-ollama:..." command in the setup guide, so the
    # model is downloaded only once whichever way you start Ollama.
    name: slm-ollama
