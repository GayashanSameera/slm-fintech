# Python project definition, managed with uv (https://docs.astral.sh/uv/).
#   uv sync          install everything into .venv (including dev tools)
#   uv run pytest    run the tests
# Dependencies are added phase by phase; each line says why it is here.

[project]
name = "slm-fintech"
version = "0.1.0"
description = "Local proof of concept: extract JSON from financial documents with a small AI model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",            # web framework for the REST API
    "uvicorn[standard]>=0.30",   # web server that runs FastAPI
    "pydantic>=2.8",             # data validation (document schemas, settings, job records)
    "pydantic-settings>=2.4",    # reads SLM_* environment variables into a Settings object
    "python-multipart>=0.0.9",   # lets FastAPI read file uploads (multipart forms)
    "httpx>=0.27",               # HTTP client used to call the AI model (Ollama)
    "pypdfium2>=4.30",           # PDF text and page images (Apache/BSD licence; not AGPL PyMuPDF)
    "python-docx>=1.1",          # read Word (.docx) text, tables and pictures
    "pillow>=10.4",              # image rotation, resizing, PNG conversion
]

[dependency-groups]
dev = [
    "pytest>=8.0",               # test runner
    "ruff>=0.6",                 # linter and formatter
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]   # never reformat code examples inside the docs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]   # S = security checks (bandit rules)
ignore = ["S101"]                          # allow assert (used in tests)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]      # tests use fake values and temp paths on purpose

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with File(...), Form(...), Query(...) in defaults: intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
